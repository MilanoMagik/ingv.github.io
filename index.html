<script>
function makeIconForEq(feature) {
	console.debug('START - makeIconForEq');
	console.debug(' mag:' + feature.properties.mag);

	var iconSize = feature.properties.mag * 5;
	var myMag = feature.properties.mag.toFixed(1);

	var myIconObj = new Object();
	myIconObj.className = 'icon-marker';
	myIconObj.iconSize = L.point(iconSize, iconSize);
	if (feature.properties.mag >= 4) {
		myIconObj.html = '<div class="labelColor">' + myMag + '</div>';
	}


	var myIcon = L.divIcon(myIconObj);
	console.debug('END - makeIconForEq');
	return myIcon;
}

function makePopoverContentForEq(feature) {
	console.debug('START - makePopoverContentForEq');
	var myMag = feature.properties.mag.toFixed(1);
	var formattedTime = formatDate(feature.properties.time);
	var contentString = '<div class="Table">'
			+ '<div class="popupheader">' + feature.properties.magType + ':' + myMag + ' - ' + feature.properties.place + '</div>'

			+ '<div class="row">'
			+   '<div class="cell text-right">'
			+       '<span class="popuplabel">time (UTC):</span>'
			+   '</div>'
			+   '<div class="cell">'
			+       formattedTime
			+   '</div>'
			+ '</div>'

			+ '<div class="row">'
			+   '<div class="cell text-right">'
			+       '<span class="popuplabel">depth (km):</span>'
			+   '</div>'
			+   '<div class="cell">'
			+       feature.geometry.coordinates[2]
			+   '</div>'
			+ '</div>'

			+ '<div class="row">'
			+   '<div class="cell text-right">'
			+       '<span class="popuplabel">type:</span>'
			+   '</div>'
			+   '<div class="cell">'
			+       feature.properties.type
			+   '</div>'
			+ '</div>'

			+ '<div class="row">'
			+   '<div class="cell text-right">'
			+       '<span class="popuplabel">author:</span>'
			+   '</div>'
			+   '<div class="cell">'
			+       feature.properties.author
			+   '</div>'
			+ '</div>'

			+ '<div class="popuplinkdetail">'
			+   "<a target=\"_blank\" href=\"https://terremoti.ingv.it/event/" + feature.properties.eventId + "\">Link ai dettagli di evento</a>"
			+ '</div>'
		+ '</div>'
		;

	console.debug('END - makePopoverContentForEq');
	return contentString;
}

function makeMarkerForEq(feature, latlng, curMakeIcon) {
	console.debug('START - makeMarkerForEq');
	var myIcon = curMakeIcon(feature);
	var zIndexNew = Math.round(Math.pow(10, feature.properties.mag));
	console.debug(' zIndexNew:' + zIndexNew);
	var marker = L.marker(latlng, {
		icon: myIcon,
		zIndexOffset:zIndexNew
	});
	console.debug('END - makeMarkerForEq');
	return marker;
}

function makeJsonLayerStyleForPlates(feature) {
    console.debug('START - makeJsonLayerStyleForPlates');
    if(feature.properties.Type == "subduction"){
        var weightForPlates = 4;
    } else {
        var weightForPlates = 1;
    }
    var jsonLayerStyle = {
        color: 'red',
        stroke: true,
        weight: weightForPlates
    }
    console.debug('END - makeJsonLayerStyleForPlates');
    return jsonLayerStyle;
}

<script>
(function() {
    var MAP_PREFS_KEY = 'ingv_map_prefs';
    var MAP_VISIBILITY_KEY = 'ingv_map_layer_visibility';

    function readJSON(key, fallback) {
        try {
            var raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
        } catch (e) {
            return fallback;
        }
    }

    function writeJSON(key, value) {
        try {
            localStorage.setItem(key, JSON.stringify(value));
        } catch (e) {
            console.warn('Unable to save map preferences:', e);
        }
    }

    function getLayerEntries() {
        if (!window.layersControl || !window.layersControl._layers) {
            return [];
        }

        var entries = [];
        Object.keys(window.layersControl._layers).forEach(function(key) {
            var entry = window.layersControl._layers[key];
            if (!entry || !entry.layer) {
                return;
            }
            var name = entry.name || entry.layerName || key;
            entries.push({
                name: name,
                layer: entry.layer,
                overlay: !!entry.overlay
            });
        });
        return entries;
    }

    function applyBaseLayer(name) {
        if (!window.map || !window.layersControl || !name) {
            return;
        }

        var entries = getLayerEntries();
        for (var i = 0; i < entries.length; i++) {
            var entry = entries[i];
            if (!entry.overlay && entry.name === name) {
                var currentBase = null;
                for (var j = 0; j < entries.length; j++) {
                    if (!entries[j].overlay && window.map.hasLayer(entries[j].layer)) {
                        currentBase = entries[j].layer;
                        break;
                    }
                }
                if (currentBase !== entry.layer) {
                    if (currentBase) {
                        window.map.removeLayer(currentBase);
                    }
                    window.map.addLayer(entry.layer);
                }
                return;
            }
        }
    }

    function applyOverlayVisibility(overlays) {
        if (!window.map || !window.layersControl || !overlays) {
            return;
        }

        var entries = getLayerEntries();
        for (var i = 0; i < entries.length; i++) {
            var entry = entries[i];
            if (!entry.overlay) {
                continue;
            }
            var shouldBeVisible = Object.prototype.hasOwnProperty.call(overlays, entry.name) ? !!overlays[entry.name] : window.map.hasLayer(entry.layer);
            if (shouldBeVisible && !window.map.hasLayer(entry.layer)) {
                window.map.addLayer(entry.layer);
            } else if (!shouldBeVisible && window.map.hasLayer(entry.layer)) {
                window.map.removeLayer(entry.layer);
            }
        }
    }

    function persistMapState() {
        if (!window.map || !window.layersControl) {
            return;
        }

        var entries = getLayerEntries();
        var selectedBase = null;
        var overlayStates = {};

        for (var i = 0; i < entries.length; i++) {
            var entry = entries[i];
            if (entry.overlay) {
                overlayStates[entry.name] = !!window.map.hasLayer(entry.layer);
            } else if (window.map.hasLayer(entry.layer)) {
                selectedBase = entry.name;
            }
        }

        writeJSON(MAP_PREFS_KEY, {
            center: [Number(window.map.getCenter().lat.toFixed(5)), Number(window.map.getCenter().lng.toFixed(5))],
            zoom: window.map.getZoom(),
            baseLayerName: selectedBase || 'Mappa stradale (Esri)',
            activeLayers: overlayStates
        });

        writeJSON(MAP_VISIBILITY_KEY, {
            baseLayerName: selectedBase || 'Mappa stradale (Esri)',
            overlays: overlayStates
        });
    }

    function restoreMapState() {
        if (!window.map || !window.layersControl) {
            return;
        }

        var savedMap = readJSON(MAP_PREFS_KEY, {});
        var savedVisibility = readJSON(MAP_VISIBILITY_KEY, {});
        var baseLayerName = savedVisibility.baseLayerName || savedMap.baseLayerName;
        var overlays = savedVisibility.overlays || savedMap.activeLayers || {};

        if (savedMap && savedMap.center && Array.isArray(savedMap.center) && savedMap.center.length === 2 && savedMap.zoom !== undefined) {
            window.map.setView([savedMap.center[0], savedMap.center[1]], Number(savedMap.zoom), { animate: false });
        }

        if (baseLayerName) {
            applyBaseLayer(baseLayerName);
        }
        if (Object.keys(overlays).length) {
            applyOverlayVisibility(overlays);
        }
    }

    function bindListeners() {
        if (!window.map) {
            return;
        }
        window.map.on('moveend zoomend', function() {
            persistMapState();
        });
        window.map.on('baselayerchange', function() {
            persistMapState();
        });
        window.map.on('overlayadd overlayremove', function() {
            persistMapState();
        });
    }

    function init() {
        if (!window.map || !window.layersControl) {
            return;
        }
        bindListeners();
        restoreMapState();
        setTimeout(function() {
            persistMapState();
            restoreMapState();
        }, 150);
        setTimeout(function() {
            persistMapState();
            restoreMapState();
        }, 800);
    }

    var tries = 0;
    function waitForMap() {
        if (window.map && window.layersControl) {
            init();
            return;
        }
        tries += 1;
        if (tries < 40) {
            setTimeout(waitForMap, 200);
        }
    }

    waitForMap();
})();
</script>
